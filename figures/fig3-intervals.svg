<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 610" width="1100" height="610" role="img"><title>Scores of each run with 95% intervals</title><rect width="1100" height="610" fill="#ffffff"/><text x="40.0" y="50.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#000000" text-anchor="start">Each score with its 95% interval</text><text x="40.0" y="84.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5a5a5a" text-anchor="start">Blue: Wilson interval (one run) or clustered by task (all runs). Grey: the usual ±1.96 standard errors.</text><line x1="400.0" y1="130.0" x2="400.0" y2="550.0" stroke="#e3e3e3" stroke-width="1.5"/><text x="400.0" y="580.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5a5a5a" text-anchor="middle">40%</text><line x1="495.4" y1="130.0" x2="495.4" y2="550.0" stroke="#e3e3e3" stroke-width="1.5"/><text x="495.4" y="580.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5a5a5a" text-anchor="middle">50%</text><line x1="590.8" y1="130.0" x2="590.8" y2="550.0" stroke="#e3e3e3" stroke-width="1.5"/><text x="590.8" y="580.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5a5a5a" text-anchor="middle">60%</text><line x1="686.2" y1="130.0" x2="686.2" y2="550.0" stroke="#e3e3e3" stroke-width="1.5"/><text x="686.2" y="580.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5a5a5a" text-anchor="middle">70%</text><line x1="781.5" y1="130.0" x2="781.5" y2="550.0" stroke="#e3e3e3" stroke-width="1.5"/><text x="781.5" y="580.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5a5a5a" text-anchor="middle">80%</text><line x1="876.9" y1="130.0" x2="876.9" y2="550.0" stroke="#e3e3e3" stroke-width="1.5"/><text x="876.9" y="580.0" font-family="Rubik, Helvetica, Arial, sans-s