<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Which true pass rates make a score of 18 out of 20 unsurprising</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs><rect width="1000" height="690" fill="#ffffff"/><text x="40.0" y="50.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#000000" text-anchor="start">Which true pass rates fit a score of 18 out of 20?</text><text x="40.0" y="84.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5a5a5a" text-anchor="start">Each bar is the range a 20-task score lands in 95% of the time, for one true pass rate.</text><text x="40.0" y="112.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5a5a5a" text-anchor="start">The dot marks the true rate itself.</text><line x1="270.0" y1="184.0" x2="270.0" y2="556.0" stroke="#e3e3e3" stroke-width="1"/><line x1="357.1" y1="184.0" x2="357.1" y2="556.0" stroke="#e3e3e3" stroke-width="1"/><line x1="444.3" y1="184.0" x2="444.3" y2="556.0" stroke="#e3e3e3" stroke-width="1"/><line x1="531.4" y1="184.0" x2="531.4" y2="556.0" stroke="#e3e3e3" stroke-width="1"/><line x1="618.6" y1="184.0" x2="618.6" y2="556.0" stroke="#e3e3e3" stroke-width="1"/><line x1="705.7" y1="184.0" x2="705.7" y2="556.0" stroke="#e3e3e3" stroke-width="1"/><line x1="792.9" y1="184.0" x2="792.9" y2="556.0" stroke="#e3e3e3" stroke-width="1"/><line x1="880.0" y1="184.0" x2="880.0" y2="556.0" stroke="#e3e3e3" stroke-width="1"/><line x1="792.9" y1="168.0" x2="792.9" y2="560.0" stroke="#000000" stroke-width="2" stroke-dasharray="6 5"/><text x="792.9" y="160.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#000000" text-anchor="middle">your score: 90%</text><text x="250.0" y="219.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#000000" text-anchor="end">true rate 60%</text><rect x="344.3" y="202.0" width="374.2" height="24.0" rx="5" fill="#e9e9e9"/><circle cx="531.4" cy="214.0" r="6" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="898.0" y="220.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5a5a5a" text-anchor="start">too low</text><text x="250.0" y="279.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#000000" text-anchor="end">true rate 70%</text><rect x="443.6" y="262.0" width="350.0" height="24.0" rx="5" fill="#2a78d6"/><circle cx="618.6" cy="274.0" r="6" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="898.0" y="280.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#2a78d6" text-anchor="start">just fits</text><text x="250.0" y="339.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#000000" text-anchor="end">true rate 80%</text><rect x="552.9" y="322.0" width="305.5" height="24.0" rx="5" fill="#2a78d6"/><circle cx="705.7" cy="334.0" r="6" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="898.0" y="340.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#2a78d6" text-anchor="start">fits</text><text x="250.0" y="399.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#000000" text-anchor="end">true rate 90%</text><rect x="678.3" y="382.0" width="201.7" height="24.0" rx="5" fill="#2a78d6"/><circle cx="792.9" cy="394.0" r="6" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="898.0" y="400.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#2a78d6" text-anchor="start">fits</text><text x="250.0" y="459.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#000000" text-anchor="end">true rate 97%</text><rect x="788.7" y="442.0" width="91.3" height="24.0" rx="5" fill="#2a78d6"/><circle cx="853.9" cy="454.0" r="6" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="898.0" y="460.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#2a78d6" text-anchor="start">just fits</text><text x="250.0" y="519.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#000000" text-anchor="end">true rate 99%</text><rect x="833.3" y="502.0" width="46.7" height="24.0" rx="5" fill="#e9e9e9"/><circle cx="871.3" cy="514.0" r="6" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="898.0" y="520.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5a5a5a" text-anchor="start">too high</text><line x1="270.0" y1="564.0" x2="880.0" y2="564.0" stroke="#000000" stroke-width="1.5"/><line x1="270.0" y1="564.0" x2="270.0" y2="570.0" stroke="#000000" stroke-width="1.5"/><text x="270.0" y="592.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5a5a5a" text-anchor="middle">30%</text><line x1="357.1" y1="564.0" x2="357.1" y2="570.0" stroke="#000000" stroke-width="1.5"/><text x="357.1" y="592.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5a5a5a" text-anchor="middle">40%</text><line x1="444.3" y1="564.0" x2="444.3" y2="570.0" stroke="#000000" stroke-width="1.5"/><text x="444.3" y="592.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5a5a5a" text-anchor="middle">50%</text><line x1="531.4" y1="564.0" x2="531.4" y2="570.0" stroke="#000000" stroke-width="1.5"/><text x="531.4" y="592.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5a5a5a" text-anchor="middle">60%</text><line x1="618.6" y1="564.0" x2="618.6" y2="570.0" stroke="#000000" stroke-width="1.5"/><text x="618.6" y="592.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5a5a5a" text-anchor="middle">70%</text><line x1="705.7" y1="564.0" x2="705.7" y2="570.0" stroke="#000000" stroke-width="1.5"/><text x="705.7" y="592.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5a5a5a" text-anchor="middle">80%</text><line x1="792.9" y1="564.0" x2="792.9" y2="570.0" stroke="#000000" stroke-width="1.5"/><text x="792.9" y="592.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5a5a5a" text-anchor="middle">90%</text><line x1="880.0" y1="564.0" x2="880.0" y2="570.0" stroke="#000000" stroke-width="1.5"/><text x="880.0" y="592.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5a5a5a" text-anchor="middle">100%</text><text x="575.0" y="620.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5a5a5a" text-anchor="middle">score on 20 tasks (bars stop at 100%, the highest possible score)</text><text x="40.0" y="668.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#000000" text-anchor="start">The true rates that fit run from 69.9% to 97.2%. That range is the Wilson interval.</text></svg>
