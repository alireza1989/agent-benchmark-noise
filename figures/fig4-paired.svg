<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" width="1100" height="350" role="img"><title>Difference between the two settings with unpaired and paired intervals</title><rect width="1100" height="350" fill="#ffffff"/><text x="40.0" y="50.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#000000" text-anchor="start">Limits off minus limits on, with 95% intervals</text><text x="40.0" y="84.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5a5a5a" text-anchor="start">Same data both times. Pairing compares each task with itself.</text><line x1="300.0" y1="120.0" x2="300.0" y2="290.0" stroke="#e3e3e3" stroke-width="1.5"/><text x="300.0" y="320.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5a5a5a" text-anchor="middle">-40 pts</text><line x1="475.0" y1="120.0" x2="475.0" y2="290.0" stroke="#e3e3e3" stroke-width="1.5"/><text x="475.0" y="320.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5a5a5a" text-anchor="middle">-20 pts</text><line x1="650.0" y1="120.0" x2="650.0" y2="290.0" stroke="#000000" stroke-width="2"/><text x="650.0" y="320.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5a5a5a" text-anchor="middle">0</text><line x1="825.0" y1="120.0" x2="825.0" y2="290.0" stroke="#e3e3e3" stroke-width="1.5"/><text x="825.0" y="320.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5a5a5a" text-anchor="middle">+20 pts</text><line x1="1000.0" y1="120.0" x2="1000.0" y2="290.0" stroke="#e3e3e3" stroke-width="1.5"/><text x="1000.0" y="320.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5a5a5a" text-anchor="middle">+40 pts</text><text x="280.0" y="157.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#000000" text-anchor="end">Unpaired</text><line x1="564.1" y1="150.0" x2="852.6" y2="150.0" stroke="#a3a3a3" stroke-width="10"/><circle cx="708.3" cy="150" r="9" fill="#000000"/><text x="866.6" y="157.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5a5a5a" text-anchor="start">-10 to +23</text><text x="280.0" y="237.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#000000" text-anchor="end">Paired by task</text><line x1="619.4" y1="230.0" x2="797.3" y2="230.0" stroke="#2a78d6" stroke-width="10"/><circle cx="708.3" cy="230" r="9" fill="#000000"/><text x="811.3" y="237.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5a5a5a" text-anchor="start">-3 to +17</text></svg>