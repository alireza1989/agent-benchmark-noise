<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>What the oracle and nop results mean for each task</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs><rect width="1000" height="600" fill="#ffffff"/><text x="40.0" y="50.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#000000" text-anchor="start">What the two baseline agents tell you about each task</text><text x="40.0" y="84.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5a5a5a" text-anchor="start">My 28 candidate tasks, sorted by the oracle and nop results on my laptop.</text><text x="435.0" y="158.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5a5a5a" text-anchor="middle">Nop fails (as it should)</text><text x="805.0" y="158.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5a5a5a" text-anchor="middle">Nop passes</text><text x="240.0" y="260.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#000000" text-anchor="end">Oracle passes</text><text x="240.0" y="286.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5a5a5a" text-anchor="end">(as it should)</text><text x="240.0" y="473.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#000000" text-anchor="end">Oracle fails</text><rect x="260.0" y="178.0" width="350.0" height="180.0" rx="10" fill="#2a78d6"/><text x="284.0" y="236.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="36" font-weight="500" fill="#ffffff" text-anchor="start">23 tasks</text><text x="284.0" y="284.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#ffffff" text-anchor="start">The task works. Keep it.</text><text x="284.0" y="316.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#ffffff" text-anchor="start">I kept 20 and left 3 spare.</text><rect x="630.0" y="178.0" width="350.0" height="180.0" rx="10" fill="#ffffff" stroke="#a3a3a3" stroke-width="1.5" stroke-dasharray="6 5"/><text x="654.0" y="236.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="36" font-weight="500" fill="#000000" text-anchor="start">0 tasks</text><text x="654.0" y="284.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#000000" text-anchor="start">The test checks too little.</text><text x="654.0" y="316.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5a5a5a" text-anchor="start">Fix it before you trust a pass.</text><rect x="260.0" y="378.0" width="350.0" height="180.0" rx="10" fill="#fdeee7" stroke="#eb6834" stroke-width="2.5"/><text x="284.0" y="436.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="36" font-weight="500" fill="#000000" text-anchor="start">5 tasks</text><text x="284.0" y="484.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#000000" text-anchor="start">Broken on this machine.</text><text x="284.0" y="516.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#000000" text-anchor="start">Drop it and report it.</text><rect x="630.0" y="378.0" width="350.0" height="180.0" rx="10" fill="#ffffff" stroke="#a3a3a3" stroke-width="1.5" stroke-dasharray="6 5"/><text x="654.0" y="436.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="36" font-weight="500" fill="#000000" text-anchor="start">0 tasks</text><text x="654.0" y="484.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#000000" text-anchor="start">The test is backwards.</text><text x="654.0" y="516.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5a5a5a" text-anchor="start">Fix it before any agent runs.</text></svg>
