<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 930" width="1000" height="930" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Five places noise enters an agent benchmark score, each with a public example</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
  </marker>
</defs>
<rect width="1000" height="930" fill="#ffffff"/>
<g font-family="Rubik, Helvetica, Arial, sans-serif" fill="#000000">
  <!-- stage boxes -->
  <rect x="40" y="30" width="300" height="110" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="62" y="76" font-size="23" font-weight="500">Tasks you picked</text>
  <text x="62" y="110" font-size="19" fill="#5a5a5a">data noise</text>
  <line x1="190" y1="146" x2="190" y2="182" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="190" width="300" height="110" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="62" y="236" font-size="23" font-weight="500">Model and API</text>
  <text x="62" y="270" font-size="19" fill="#5a5a5a">sampling noise</text>
  <line x1="190" y1="306" x2="190" y2="342" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="350" width="300" height="110" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="62" y="396" font-size="23" font-weight="500">Harness and settings</text>
  <text x="62" y="430" font-size="19" fill="#5a5a5a">setup choices</text>
  <line x1="190" y1="466" x2="190" y2="502" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="510" width="300" height="110" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="62" y="556" font-size="23" font-weight="500">Container and machine</text>
  <text x="62" y="590" font-size="19" fill="#5a5a5a">infrastructure noise</text>
  <line x1="190" y1="626" x2="190" y2="662" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="670" width="300" height="110" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="62" y="716" font-size="23" font-weight="500">Verifier</text>
  <text x="62" y="750" font-size="19" fill="#5a5a5a">grading noise</text>
  <line x1="190" y1="786" x2="190" y2="822" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="830" width="300" height="70" rx="10" fill="#2a78d6"/>
  <text x="190" y="874" font-size="24" font-weight="500" fill="#ffffff" text-anchor="middle">One score</text>
  <text x="370" y="860" font-size="20" fill="#5a5a5a">The number you report mixes all five.</text>
  <text x="370" y="888" font-size="20" fill="#5a5a5a">This post checks each one on real runs.</text>

  <!-- explanations -->
  <text x="370" y="66" font-size="20">A different set of tasks gives a different score,</text>
  <text x="370" y="94" font-size="20">even for the same agent.</text>
  <text x="370" y="124" font-size="18" fill="#5a5a5a">Spotting a 3-point gap can take about 1,000 questions (Miller, 2024)</text>

  <text x="370" y="226" font-size="20">The same request gets a different answer each time.</text>
  <text x="370" y="254" font-size="20">Temperature 0 doesn't stop it.</text>
  <text x="370" y="284" font-size="18" fill="#5a5a5a">1,000 calls at temperature 0: 80 different outputs (He, 2025)</text>

  <text x="370" y="386" font-size="20">Scaffold, prompt, effort, token budget and API</text>
  <text x="370" y="414" font-size="20">client all change what the model can do.</text>
  <text x="370" y="444" font-size="18" fill="#5a5a5a">Scaffold alone: up to 15 points on SWE-bench Verified (Epoch AI, 2025)</text>

  <text x="370" y="546" font-size="20">CPU and memory limits, timeouts, network and</text>
  <text x="370" y="574" font-size="20">load decide what the agent is able to try.</text>
  <text x="370" y="604" font-size="18" fill="#5a5a5a">Resource limits alone: 6 points on Terminal-Bench 2.0 (Anthropic, 2026)</text>

  <text x="370" y="706" font-size="20">Tests that check too little, or that break on</text>
  <text x="370" y="734" font-size="20">their own, add errors that look like results.</text>
  <text x="370" y="764" font-size="18" fill="#5a5a5a">Do-nothing agent: 38% on τ-bench airline tasks (Zhu et al., 2025)</text>
</g>
</svg>
