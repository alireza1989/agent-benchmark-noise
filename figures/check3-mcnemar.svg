<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>McNemar's test worked by hand for limits-1 versus limits-2</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs><rect width="1000" height="610" fill="#ffffff"/><text x="40.0" y="50.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#000000" text-anchor="start">McNemar's test by hand: limits-1 versus limits-2</text><text x="40.0" y="84.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5a5a5a" text-anchor="start">Only the tasks that flipped count. If the runs are the same, each flip is a coin toss.</text><text x="40.0" y="150.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#000000" text-anchor="start">Step 1: sort the 20 tasks into four groups</text><text x="270.0" y="192.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5a5a5a" text-anchor="middle">limits-2 passed</text><text x="410.0" y="192.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5a5a5a" text-anchor="middle">limits-2 failed</text><text x="192.0" y="271.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#000000" text-anchor="end">limits-1 passed</text><text x="192.0" y="401.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#000000" text-anchor="end">limits-1 failed</text><rect x="205.0" y="205.0" width="130.0" height="120.0" rx="8" fill="#e9e9e9"/><text x="270.0" y="257.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="38" font-weight="500" fill="#000000" text-anchor="middle">16</text><text x="270.0" y="287.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5a5a5a" text-anchor="middle">passed in both</text><rect x="345.0" y="205.0" width="130.0" height="120.0" rx="8" fill="#2a78d6"/><text x="410.0" y="257.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="38" font-weight="500" fill="#ffffff" text-anchor="middle">2</text><text x="410.0" y="287.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#ffffff" text-anchor="middle">passed only</text><text x="410.0" y="307.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#ffffff" text-anchor="middle">in limits-1</text><rect x="205.0" y="335.0" width="130.0" height="120.0" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="2.5"/><text x="270.0" y="387.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="38" font-weight="500" fill="#000000" text-anchor="middle">0</text><text x="270.0" y="417.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5a5a5a" text-anchor="middle">passed only</text><text x="270.0" y="437.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5a5a5a" text-anchor="middle">in limits-2</text><rect x="345.0" y="335.0" width="130.0" height="120.0" rx="8" fill="#e9e9e9"/><text x="410.0" y="387.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="38" font-weight="500" fill="#000000" text-anchor="middle">2</text><text x="410.0" y="417.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5a5a5a" text-anchor="middle">failed in both</text><text x="40.0" y="500.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5a5a5a" text-anchor="start">The 18 tasks that came out the same can't</text><text x="40.0" y="524.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5a5a5a" text-anchor="start">tell the runs apart, so set them aside.</text><text x="40.0" y="566.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#000000" text-anchor="start">That leaves 2 flips, both toward limits-1.</text><line x1="520.0" y1="125.0" x2="520.0" y2="580.0" stroke="#e3e3e3" stroke-width="1.5"/><text x="560.0" y="150.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#000000" text-anchor="start">Steps 2 and 3: toss two fair coins</text><text x="560.0" y="180.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5a5a5a" text-anchor="start">Each coin is one flip: 1 if the task passed only in</text><text x="560.0" y="202.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5a5a5a" text-anchor="start">limits-1, 2 if it passed only in limits-2.</text><rect x="550.0" y="228.0" width="410.0" height="54.0" rx="8" fill="#e8f1fc"/><circle cx="590.0" cy="255.0" r="21" fill="#2a78d6"/><text x="590.0" y="262.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#ffffff" text-anchor="middle">1</text><circle cx="648.0" cy="255.0" r="21" fill="#2a78d6"/><text x="648.0" y="262.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#ffffff" text-anchor="middle">1</text><text x="700.0" y="263.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#000000" text-anchor="start">2–0</text><text x="760.0" y="262.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#000000" text-anchor="start">as lopsided as ours</text><circle cx="590.0" cy="319.0" r="21" fill="#ffffff" stroke="#a3a3a3" stroke-width="2"/><text x="590.0" y="326.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#5a5a5a" text-anchor="middle">1</text><circle cx="648.0" cy="319.0" r="21" fill="#ffffff" stroke="#a3a3a3" stroke-width="2"/><text x="648.0" y="326.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#5a5a5a" text-anchor="middle">2</text><text x="700.0" y="327.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#5a5a5a" text-anchor="start">1–1</text><text x="760.0" y="326.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5a5a5a" text-anchor="start">even</text><circle cx="590.0" cy="383.0" r="21" fill="#ffffff" stroke="#a3a3a3" stroke-width="2"/><text x="590.0" y="390.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#5a5a5a" text-anchor="middle">2</text><circle cx="648.0" cy="383.0" r="21" fill="#ffffff" stroke="#a3a3a3" stroke-width="2"/><text x="648.0" y="390.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#5a5a5a" text-anchor="middle">1</text><text x="700.0" y="391.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#5a5a5a" text-anchor="start">1–1</text><text x="760.0" y="390.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5a5a5a" text-anchor="start">even</text><rect x="550.0" y="420.0" width="410.0" height="54.0" rx="8" fill="#e8f1fc"/><circle cx="590.0" cy="447.0" r="21" fill="#2a78d6"/><text x="590.0" y="454.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#ffffff" text-anchor="middle">2</text><circle cx="648.0" cy="447.0" r="21" fill="#2a78d6"/><text x="648.0" y="454.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#ffffff" text-anchor="middle">2</text><text x="700.0" y="455.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#000000" text-anchor="start">0–2</text><text x="760.0" y="454.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#000000" text-anchor="start">as lopsided as ours</text><text x="560.0" y="516.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#000000" text-anchor="start">2 of the 4 equally likely outcomes are at</text><text x="560.0" y="538.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#000000" text-anchor="start">least as lopsided as the real result.</text><text x="560.0" y="580.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#000000" text-anchor="start">p = 2 ÷ 4 = 0.50</text></svg>
