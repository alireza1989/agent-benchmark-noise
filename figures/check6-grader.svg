<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 505" width="1000" height="505" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>The grader's exact-text check on python -m venv</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs><rect width="1000" height="505" fill="#ffffff"/><text x="40.0" y="50.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#000000" text-anchor="start">What the grader saw in reproducibility-and-envsetup</text><text x="40.0" y="84.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5a5a5a" text-anchor="start">The test passes only if a line of repro.sh contains the exact text <tspan font-family="Menlo, 'DejaVu Sans Mono', Consolas, monospace" fill="#000000">python -m venv</tspan></text><text x="40.0" y="150.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5a5a5a" text-anchor="start">Runs</text><text x="230.0" y="150.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5a5a5a" text-anchor="start">What the agent wrote</text><text x="650.0" y="150.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5a5a5a" text-anchor="start">What it does</text><text x="838.0" y="150.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5a5a5a" text-anchor="start">Test result</text><text x="40.0" y="212.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#000000" text-anchor="start">Limits on</text><text x="40.0" y="240.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5a5a5a" text-anchor="start">3 of 3 runs</text><rect x="230.0" y="184.0" width="384.0" height="66.0" rx="6" fill="#f1f1f1"/><text x="246.0" y="224.0" font-family="Menlo, 'DejaVu Sans Mono', Consolas, monospace" font-size="18" font-weight="400" fill="#000000" text-anchor="start">python<tspan fill="#eb6834" font-weight="700">3</tspan> -m venv /tmp/repro-venv1</text><line x1="620.0" y1="217.0" x2="646.0" y2="217.0" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/><rect x="650.0" y="184.0" width="160.0" height="66.0" rx="6" fill="#ffffff" stroke="#a3a3a3" stroke-width="1.5"/><text x="730.0" y="212.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#000000" text-anchor="middle">creates the</text><text x="730.0" y="234.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#000000" text-anchor="middle">environment</text><line x1="816.0" y1="217.0" x2="834.0" y2="217.0" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/><rect x="838.0" y="184.0" width="122.0" height="66.0" rx="6" fill="#e9e9e9"/><text x="899.0" y="226.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#000000" text-anchor="middle">fail</text><text x="40.0" y="332.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#000000" text-anchor="start">Limits off</text><text x="40.0" y="360.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5a5a5a" text-anchor="start">2 of 2 runs</text><rect x="230.0" y="304.0" width="384.0" height="66.0" rx="6" fill="#f1f1f1"/><text x="246.0" y="344.0" font-family="Menlo, 'DejaVu Sans Mono', Consolas, monospace" font-size="18" font-weight="400" fill="#000000" text-anchor="start"><tspan fill="#2a78d6" font-weight="700">python -m venv</tspan> /tmp/repro-venv1</text><line x1="620.0" y1="337.0" x2="646.0" y2="337.0" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/><rect x="650.0" y="304.0" width="160.0" height="66.0" rx="6" fill="#ffffff" stroke="#a3a3a3" stroke-width="1.5"/><text x="730.0" y="332.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#000000" text-anchor="middle">creates the</text><text x="730.0" y="354.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#000000" text-anchor="middle">environment</text><line x1="816.0" y1="337.0" x2="834.0" y2="337.0" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/><rect x="838.0" y="304.0" width="122.0" height="66.0" rx="6" fill="#2a78d6"/><text x="899.0" y="346.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#ffffff" text-anchor="middle">pass</text><text x="40.0" y="450.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5a5a5a" text-anchor="start">Both lines build the same environment in this container. The other five tests, which</text><text x="40.0" y="476.0" font-family="Rubik, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5a5a5a" text-anchor="start">check the actual outputs, passed in all five trials. Only the command name decided the result.</text></svg>
